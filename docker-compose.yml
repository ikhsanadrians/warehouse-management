services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: warehouse_management
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://warehouse:warehouse@postgres:5432/warehouse_management?sslmode=disable
      CORS_ALLOWED_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      READ_HEADER_TIMEOUT_SECONDS: 5
      SHUTDOWN_TIMEOUT_SECONDS: 10
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
