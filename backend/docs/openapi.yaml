openapi: 3.0.3
info:
  title: Warehouse Management API
  version: 0.1.0
  description: REST API for the warehouse management technical test.
servers:
  - url: http://localhost:8080
tags:
  - name: Health
  - name: Items
  - name: Stock
paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/items:
    get:
      tags:
        - Items
      summary: List items
      description: Returns non-deleted items. Supports optional category filtering and pagination.
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          example: electronics
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 10
      responses:
        "200":
          description: Items retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemListResponse"
        "400":
          description: Invalid pagination query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Items
      summary: Create item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemRequest"
      responses:
        "201":
          description: Item created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "400":
          description: Invalid JSON body or missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: SKU already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/items/{id}:
    get:
      tags:
        - Items
      summary: Get item detail
      parameters:
        - $ref: "#/components/parameters/ItemID"
      responses:
        "200":
          description: Item retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "400":
          description: Invalid item ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Items
      summary: Update item
      parameters:
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemRequest"
      responses:
        "200":
          description: Item updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "400":
          description: Invalid item ID, invalid JSON body, or missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: SKU already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Items
      summary: Soft delete item
      description: Sets deleted_at; the row is not physically removed.
      parameters:
        - $ref: "#/components/parameters/ItemID"
      responses:
        "200":
          description: Item deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteItemResponse"
        "400":
          description: Invalid item ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/stock/receive:
    post:
      tags:
        - Stock
      summary: Receive stock
      description: Increases stock for an existing active item at an existing location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveStockRequest"
      responses:
        "200":
          description: Stock received successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockResponse"
        "400":
          description: Invalid JSON body, missing required fields, invalid IDs, or quantity not greater than zero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item or location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/stock/{item_id}:
    get:
      tags:
        - Stock
      summary: Get stock for item
      description: Returns stock for the item across all warehouse locations.
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        "200":
          description: Stock retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockLocationListResponse"
        "400":
          description: Invalid item ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    ItemID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1
  schemas:
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          example: sku
        reason:
          type: string
          example: Required
      required:
        - reason
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Invalid request
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
      required:
        - success
        - message
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
        - status
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Service is healthy
        data:
          $ref: "#/components/schemas/HealthStatus"
      required:
        - success
        - message
        - data
    ItemRequest:
      type: object
      properties:
        sku:
          type: string
          example: SKU-001
        name:
          type: string
          example: Safety Gloves
        category:
          type: string
          example: Safety
        unit:
          type: string
          example: pcs
      required:
        - sku
        - name
        - category
        - unit
    Item:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        sku:
          type: string
          example: SKU-001
        name:
          type: string
          example: Safety Gloves
        category:
          type: string
          example: Safety
        unit:
          type: string
          example: pcs
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - sku
        - name
        - category
        - unit
        - created_at
        - updated_at
    ItemResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Item retrieved successfully
        data:
          $ref: "#/components/schemas/Item"
      required:
        - success
        - message
        - data
    ItemListMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 42
      required:
        - page
        - limit
        - total
    ItemListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Items retrieved successfully
        data:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        meta:
          $ref: "#/components/schemas/ItemListMeta"
      required:
        - success
        - message
        - data
        - meta
    DeleteItemResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Item deleted successfully
      required:
        - success
        - message
    ReceiveStockRequest:
      type: object
      properties:
        item_id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        location_id:
          type: integer
          format: int64
          minimum: 1
          example: 2
        qty:
          type: integer
          minimum: 1
          example: 10
      required:
        - item_id
        - location_id
        - qty
    Stock:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        item_id:
          type: integer
          format: int64
          example: 1
        location_id:
          type: integer
          format: int64
          example: 2
        qty:
          type: integer
          example: 10
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - item_id
        - location_id
        - qty
        - updated_at
    StockResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Stock received successfully
        data:
          $ref: "#/components/schemas/Stock"
      required:
        - success
        - message
        - data
    StockLocation:
      type: object
      properties:
        location_id:
          type: integer
          format: int64
          example: 1
        code:
          type: string
          example: A-01
        zone:
          type: string
          example: A
        type:
          type: string
          example: RACK
        qty:
          type: integer
          example: 20
      required:
        - location_id
        - code
        - zone
        - type
        - qty
    StockLocationListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Stock retrieved successfully
        data:
          type: array
          items:
            $ref: "#/components/schemas/StockLocation"
      required:
        - success
        - message
        - data
